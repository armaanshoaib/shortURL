
services:
  db:
    image: mysql:latest
    restart: always
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: urls
    ports:
      - "3306:3306"
    volumes:
      - sql-nv:/var/lib/mysql

  web:
    image: armaanshoaibas/shorturl-web:1.0
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  sql-nv:
